<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
  #bg {
    position:fixed; inset:0; width:100%; height:100%;
    background-size:cover; background-position:center; background-color:#111;
  }
  #bg.plantilla-solido { background-image:radial-gradient(circle at 30% 20%, #262626 0%, #000 75%); }
  #bg.plantilla-diagonal { background-image:repeating-linear-gradient(45deg, #000 0 40px, var(--acento) 40px 44px); }
  #bg.plantilla-puntos {
    background-color:#111;
    background-image:radial-gradient(var(--acento) 2.5px, transparent 2.5px);
    background-size:30px 30px;
  }
  #bg.plantilla-lineas { background-image:repeating-linear-gradient(0deg, #0a0a0a 0 30px, #181818 30px 32px); }

  #qrBox {
    position:fixed; bottom:4%; right:3%; z-index:6;
    background:#fff; border-radius:10px; padding:10px; text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,.5); display:none;
  }
  #qrBox img { width:9vw; min-width:80px; display:block; }
  #qrBox span { display:block; font-size:clamp(9px, 0.8vw, 14px); color:#333; margin-top:4px; font-family:Arial, sans-serif; }
  #bgVideo {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; background-color:#111; display:none;
  }
  :root { --acento:#c81414; --acento-oscuro:#8f0f0f; --texto:#ffffff; }

  #carrusel {
    position:fixed; left:0; right:0; bottom:4%; display:flex; gap:1.6%; padding:0 3%;
  }
  #carrusel.centro2 { bottom:8%; }

  .caja {
    flex:1; min-width:0; height:100%; position:relative;
    background:#111; border:3px solid var(--acento); border-radius:12px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }

  .etiqueta {
    position:absolute; top:0; left:0; z-index:5;
    text-align:center;
    font-family:'Anton', 'Arial Black', Arial, sans-serif; text-transform:uppercase;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);
    font-size:1vw; letter-spacing:0.5px;
    padding:0.5vw 1.4vw 0.5vw 0.8vw;
    clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  #carrusel.centro2 .etiqueta { font-size:1.3vw; }

  .caja .titulo {
    flex:0 0 auto;
    color:var(--texto); text-align:center; font-family:'Anton', 'Arial Black', Arial, sans-serif;
    font-weight:normal; font-size:2.3vw; padding:1.4% 3% 0.8%;
    text-transform:uppercase; letter-spacing:0.5px; background:#000;
  }
  #carrusel.centro2 .caja .titulo { font-size:3vw; }

  .caja .descripcion {
    flex:0 0 auto; position:relative;
    background:var(--acento); color:var(--texto); text-align:center;
    font-size:1.05vw; line-height:1.2; font-weight:bold;
    padding:1.6% 6%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    clip-path: polygon(1.5% 0, 98.5% 0, 100% 50%, 98.5% 100%, 1.5% 100%, 0 50%);
  }
  #carrusel.centro2 .caja .descripcion { font-size:1.4vw; }

  .caja .imagen-wrap { flex:1 1 auto; min-height:0; background:#1a1a1a; position:relative; }
  .caja .imagen-wrap img { width:100%; height:100%; display:block; }
  .caja .imagen-wrap img.cubrir { object-fit:cover; }
  .caja .imagen-wrap img.contener { object-fit:contain; }

  .caja .precios {
    flex:0 0 auto; background:var(--acento); display:flex; justify-content:center; gap:6%;
    padding:2.6% 0; border-top:2px solid var(--acento-oscuro);
  }
  .caja .precios .item { color:var(--texto); text-align:center; line-height:1; }
  .caja .precios .monto { font-family:'Anton', 'Arial Black', Arial, sans-serif; font-size:3.4vw; }
  #carrusel.centro2 .caja .precios .monto { font-size:4.4vw; }
  .caja .precios .unidad { font-size:1.3vw; opacity:.9; text-transform:uppercase; margin-top:2px; }
  #carrusel.centro2 .caja .precios .unidad { font-size:1.6vw; }

  #vacio { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#666; font-size:3vw; font-family:Arial, sans-serif; }
  #btnFull {
    position:fixed; top:12px; right:12px; z-index:10;
    background:#c81414; color:#fff; border:none; border-radius:8px;
    padding:10px 16px; font-size:14px; font-family:Arial, sans-serif; cursor:pointer;
  }
  body.en-fullscreen #btnFull { display:none; }
</style>
</head>
<body>
  <div id="bg"></div>
  <video id="bgVideo" autoplay muted loop playsinline></video>
  <div id="carrusel" class="abajo3"></div>
  <div id="vacio" style="display:none;">Agrega productos desde el panel de control</div>
  <button id="btnFull" onclick="entrarFullscreen()">Pantalla completa</button>
  <div id="qrBox"><img id="qrImg" src=""><span>Ver catálogo</span></div>

<script>
const SCREEN_ID = "{{ screen_id }}";
let state = { products: [], rotation_seconds: 4, visible_count: 3, background: null, layout: 'abajo3', alto_caja: 45, color_acento: '#c81414', color_texto: '#ffffff' };
let offset = 0;

function oscurecer(hex, factor = 0.35) {
  hex = (hex || '#c81414').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = Math.round(parseInt(hex.substr(0,2),16) * (1 - factor));
  const g = Math.round(parseInt(hex.substr(2,2),16) * (1 - factor));
  const b = Math.round(parseInt(hex.substr(4,2),16) * (1 - factor));
  return `rgb(${r},${g},${b})`;
}

async function cargarDatos() {
  try {
    const res = await fetch(`/api/data?screen=${SCREEN_ID}`);
    const data = await res.json();
    if (data.error) return;
    state.products = data.products || [];
    state.rotation_seconds = data.rotation_seconds || 4;
    state.visible_count = data.visible_count || 3;
    state.layout = data.layout || 'abajo3';
    state.alto_caja = data.alto_caja || 45;
    state.color_acento = data.color_acento || '#c81414';
    state.color_texto = data.color_texto || '#ffffff';
    document.getElementById('carrusel').className = state.layout;
    document.getElementById('carrusel').style.height = state.alto_caja + '%';
    document.documentElement.style.setProperty('--acento', state.color_acento);
    document.documentElement.style.setProperty('--acento-oscuro', oscurecer(state.color_acento));
    document.documentElement.style.setProperty('--texto', state.color_texto);
    aplicarFondo(data);

    const qrBox = document.getElementById('qrBox');
    if (data.mostrar_qr) {
      const qrImg = document.getElementById('qrImg');
      if (!qrImg.dataset.cargado) {
        qrImg.src = `/api/qr?screen=${SCREEN_ID}`;
        qrImg.dataset.cargado = '1';
      }
      qrBox.style.display = 'block';
    } else {
      qrBox.style.display = 'none';
    }
  } catch (e) { console.error(e); }
}

let ultimoFondoKey = null;
function aplicarFondo(data) {
  const bgImg = document.getElementById('bg');
  const bgVid = document.getElementById('bgVideo');
  const tipo = data.background_tipo || 'imagen';
  const key = tipo + '|' + (tipo === 'plantilla' ? data.plantilla_id : data.background);
  if (key === ultimoFondoKey) return;
  ultimoFondoKey = key;

  bgImg.className = '';
  if (tipo === 'plantilla') {
    bgVid.style.display = 'none';
    bgVid.removeAttribute('src');
    bgImg.style.display = 'block';
    bgImg.style.backgroundImage = '';
    bgImg.className = 'plantilla-' + (data.plantilla_id || 'solido');
  } else if (tipo === 'video' && data.background) {
    bgImg.style.display = 'none';
    bgVid.style.display = 'block';
    bgVid.src = data.background;
  } else if (data.background) {
    bgVid.style.display = 'none';
    bgVid.removeAttribute('src');
    bgImg.style.display = 'block';
    bgImg.style.backgroundImage = `url('${data.background}')`;
  }
}

function render() {
  const cont = document.getElementById('carrusel');
  const vacio = document.getElementById('vacio');
  const n = state.products.length;
  if (n === 0) {
    cont.innerHTML = '';
    vacio.style.display = 'flex';
    return;
  }
  vacio.style.display = 'none';

  const visibles = Math.min(state.visible_count, n);
  cont.innerHTML = '';
  for (let i = 0; i < visibles; i++) {
    const p = state.products[(offset + i) % n];
    const precios = (p.precios || []).map(pr =>
      `<div class="item"><div class="monto">$${pr.precio}</div><div class="unidad">/${pr.unidad}</div></div>`
    ).join('');
    // modo 'recorte' (fondo removido) -> se ve completa (contain), con color de fondo propio; 'normal' -> llena el recuadro (cover)
    const esRecorte = p.image_modo === 'recorte';
    const claseImg = esRecorte ? 'contener' : 'cubrir';
    let fondoWrap = '';
    if (esRecorte) {
      if (p.fondo_recorte_imagen) {
        fondoWrap = `style="background-image:url('${p.fondo_recorte_imagen}'); background-size:cover; background-position:center;"`;
      } else {
        fondoWrap = `style="background:${p.fondo_recorte || '#ffffff'}"`;
      }
    }
    const caja = document.createElement('div');
    caja.className = 'caja';
    caja.innerHTML = `
      ${p.etiqueta ? `<div class="etiqueta" style="background:${p.etiqueta_color || '#ffcc00'}">${p.etiqueta}</div>` : ''}
      <div class="titulo">${p.titulo || ''}</div>
      ${p.descripcion ? `<div class="descripcion">${p.descripcion}</div>` : ''}
      <div class="imagen-wrap" ${fondoWrap}>${p.image ? `<img class="${claseImg}" src="${p.image}">` : ''}</div>
      <div class="precios">${precios.length ? precios : ''}</div>
    `;
    cont.appendChild(caja);
  }
}

function avanzar() {
  if (state.products.length > 0) {
    offset = (offset + 1) % state.products.length;
  }
  render();
}

let timer = null;
let rotActual = null;
function asegurarTimer() {
  if (rotActual !== state.rotation_seconds) {
    rotActual = state.rotation_seconds;
    if (timer) clearInterval(timer);
    timer = setInterval(avanzar, (state.rotation_seconds || 4) * 1000);
  }
}

async function iniciar() {
  await cargarDatos();
  render();
  asegurarTimer();
}

function entrarFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  document.body.classList.add('en-fullscreen');
}
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('en-fullscreen', !!document.fullscreenElement);
});

iniciar();
setInterval(async () => { await cargarDatos(); asegurarTimer(); }, 5000);
</script>
</body>
</html>
